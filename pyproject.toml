[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "founder-decision-openenv"
version = "0.1.0"
description = "A frozen synthetic founder-decision RLVR environment with an exact upstream record schema"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.15"
dependencies = [
  "openenv==0.4.1",
  "pydantic>=2.11,<3",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[project.scripts]
server = "yc_founder_decision_env.server.app:main"
ycfd-demo = "yc_founder_decision_env.demo:main"
ycfd-baselines = "yc_founder_decision_env.baselines:main"
ycfd-agent-trial = "yc_founder_decision_env.agent_trial:main"
ycfd-q-learning = "yc_founder_decision_env.q_learning:main"
ycfd-rl-evaluate = "yc_founder_decision_env.rl_evaluation:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
yc_founder_decision_env = ["assets/*.json", "assets/*.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["yc_founder_decision_env"]
disable_error_code = ["import-untyped"]
disallow_subclassing_any = false
warn_return_any = false
